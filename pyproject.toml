[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-pretrain-pipeline"
version = "0.1.0"
description = "Deterministic TXT-to-JSONL preprocessing pipeline for LLM pretraining"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "Pretrain Dataset Team"}]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
hf = [
  "transformers>=4.40",
  "tokenizers>=0.15",
  "sentencepiece>=0.1.99",
]
fasttext = ["fasttext-wheel>=0.9.2", "numpy<2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ebook-pipeline = "ebook_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebook_pipeline = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]