# Production profile. Local tokenizer assets are configured; language detector auto-falls back to heuristic without fastText.
profile: production
paths:
  books_dir: ../books
  work_dir: ../data

tokenizer:
  backend: tokenizer_json
  name: deepseek-v3-tokenizer
  hf_model: null
  tokenizer_json: tokenizer.json
  vocab_files:
    - tokenizer.json
    - tokenizer_config.json
  local_files_only: true
  eos_ids: [1]
  eos_loss: 1

l0:
  min_chars: 1024
  replacement_ratio_max: 0.001
  control_ratio_max: 0.005
  encoding_whitelist: [utf-8, gb18030, big5, utf-16]
  cleaning:
    page_number_max_chars: 12
    toc_scan_lines: 200
    header_footer_min_count: 5
    header_footer_min_ratio: 0.01
    header_footer_max_chars: 40
    hard_wrap_max_joins: 5
  structure:
    max_chapters: 300
    avg_tokens_min: 100
    chars_per_token: 2.0
    heading_max_chars: 80
    loose_scan_radius: 2

l1:
  target_langs: [zh, en]
  gates: [rule_v1, stat_v1, lang]
  simhash_bits: 128
  simhash_hamming: 3
  simhash_bands: 8
  simhash_shingle_size: 4
  simhash_max_shingles: 500000
  stat_threshold: 0.35
  stat_weights:
    repetition: 0.25
    lexical: 0.20
    sentence: 0.15
    script: 0.15
    language: 0.25
  min_tokens: 256
  max_url_density: 0.002
  max_junk_line_ratio: 0.10
  max_copyright_block_chars: 500
  ad_patterns:
    - '(?i)(加|联系)?\s*(微信|QQ|q q)\s*[:：]?\s*[A-Za-z0-9_-]{5,}'
    - '(?i)本书由.{0,40}(整理|制作|发布)'
    - '(?i)(扫码|关注公众号|更多电子书|免费下载)'
  language:
    detector: auto                 # fasttext | auto | heuristic
    model_path: ../models/lid.176.bin
    heuristic_fallback: true
    require_fasttext: true        # set true to hard-fail when fastText/model is unavailable
    max_chars: 5000

l2:
  max_tokens: 30000
  min_tokens: 256
  merge_policy: same_chapter
  separators:
    - "\n\n"
    - "\n"
    - "。！？；…"
    - ".!?;"
    - "，,"

l3:
  algorithm: obfd
  bin_size: 32700
  pack_mode: bfd                   # bfd | per_book
  max_chunks_in_memory: 2000000
  external_sort_runs: 64
  temp_dir: null

l4:
  format: jsonl
  shard_size_tokens: 2000000000

determinism:
  shuffle_seed: 42

runtime:
  log_level: INFO
  lock_timeout_seconds: 0
  validate_after_run: true
  validation_sample_packs: 10
  validation_sample_chunks: 1000
  alert_rejection_rate: 0.40
  alert_fill_ratio: 0.90
  alert_cross_doc_ratio: 0.30
  alert_target_language_ratio: 0.95
  alert_cross_doc_8gram_ratio: 0.01